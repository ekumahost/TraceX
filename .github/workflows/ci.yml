name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (TypeScript API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: application/backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Unit + integration tests
        run: npm test

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: application/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit tests
        run: npm test
      - run: npm run build

  analysis-engine:
    name: Analysis engine (Python + NetworkX)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application/analysis-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: application/analysis-engine/requirements-dev.txt
      - run: pip install -r requirements.txt pytest==8.3.3
      - name: Detector tests (incl. parity with the TypeScript copy)
        run: python -m pytest -q
