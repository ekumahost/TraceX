# Runs the backend and the analysis engine locally. No database: traces are computed on demand
# and the backend keeps a short in-memory cache. (A database for saved investigations is a
# possible later addition, not needed today.)
services:
  analysis-engine:
    build: ./analysis-engine
    ports:
      - "8100:8000"

  backend:
    build: ./backend
    ports:
      - "4000:4000"
    depends_on:
      - analysis-engine
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # use the local engine; remove this line to use the Modal URL from backend/.env instead
      - ANALYSIS_ENGINE_URL=http://analysis-engine:8000
