version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: tracex
      POSTGRES_USER: tracex
      POSTGRES_PASSWORD: tracex_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  analysis-engine:
    build: ./analysis-engine
    ports:
      - "8000:8000"
    environment:
      - PYTHON_ENV=development
    volumes:
      - ./analysis-engine:/app

  backend:
    build: ./backend
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis
      - analysis-engine
    environment:
      - DATABASE_URL=postgresql://tracex:tracex_dev@postgres:5432/tracex
      - REDIS_URL=redis://redis:6379

volumes:
  postgres_data:
